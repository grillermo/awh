<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DISPLAY_CROP Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
  h1 { font-size: 1.1em; margin-bottom: 12px; color: #aaa; }
  #canvas-wrap { position: relative; display: inline-block; cursor: crosshair; }
  canvas { display: block; }
  #output { margin-top: 16px; }
  #value-box {
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 1.1em;
    color: #f9ca24;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  #crop-value { flex: 1; letter-spacing: 0.02em; }
  #copy-btn {
    background: #2d6a4f;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: monospace;
    font-size: 0.95em;
  }
  #copy-btn:hover { background: #40916c; }
  #copy-btn.copied { background: #52b788; }
  #hint { margin-top: 8px; color: #666; font-size: 0.82em; }
  #coords-detail { margin-top: 8px; color: #888; font-size: 0.85em; }
</style>
</head>
<body>
<h1>DISPLAY_CROP Tuner — drag handles to adjust, drag interior to move</h1>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>
<div id="output">
  <div id="value-box">
    <span id="crop-value">DISPLAY_CROP = (0.648, 0.704, 0.732, 0.866)</span>
    <button id="copy-btn" onclick="copyValue()">Copy</button>
  </div>
  <div id="coords-detail"></div>
  <div id="hint">Drag corners/edges to resize · Drag inside to move · Drag outside to draw new rect</div>
</div>

<script>
const IMG_SRC = 'frame.jpg';
const HANDLE_SIZE = 8;

// Initial DISPLAY_CROP = (left, top, right, bottom)
let rect = { l: 0.648, t: 0.704, r: 0.732, b: 0.866 };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const img = new Image();

let imgW, imgH, scale, canvasW, canvasH;

img.onload = () => {
  imgW = img.naturalWidth;
  imgH = img.naturalHeight;
  // Fit to max 900px wide or 600px tall
  const maxW = Math.min(900, window.innerWidth - 40);
  const maxH = 600;
  scale = Math.min(maxW / imgW, maxH / imgH, 1);
  canvasW = Math.round(imgW * scale);
  canvasH = Math.round(imgH * scale);
  canvas.width = canvasW;
  canvas.height = canvasH;
  draw();
};
img.src = IMG_SRC;

// Convert fraction rect to canvas pixels
function toCanvas(r) {
  return {
    x: r.l * canvasW,
    y: r.t * canvasH,
    w: (r.r - r.l) * canvasW,
    h: (r.b - r.t) * canvasH,
  };
}

function toFrac(cx, cy) {
  return { fx: cx / canvasW, fy: cy / canvasH };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function draw() {
  ctx.clearRect(0, 0, canvasW, canvasH);
  ctx.drawImage(img, 0, 0, canvasW, canvasH);

  const { x, y, w, h } = toCanvas(rect);

  // Dimming outside
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, canvasW, y);                    // top
  ctx.fillRect(0, y + h, canvasW, canvasH - y - h); // bottom
  ctx.fillRect(0, y, x, h);                          // left
  ctx.fillRect(x + w, y, canvasW - x - w, h);        // right

  // Rect border
  ctx.strokeStyle = '#f9ca24';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  // Handles
  ctx.fillStyle = '#f9ca24';
  for (const [hx, hy] of handles(x, y, w, h)) {
    ctx.fillRect(hx - HANDLE_SIZE / 2, hy - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
  }

  updateOutput();
}

function handles(x, y, w, h) {
  const mx = x + w / 2, my = y + h / 2;
  return [
    [x,      y     ],  // 0 TL
    [mx,     y     ],  // 1 T
    [x + w,  y     ],  // 2 TR
    [x + w,  my    ],  // 3 R
    [x + w,  y + h ],  // 4 BR
    [mx,     y + h ],  // 5 B
    [x,      y + h ],  // 6 BL
    [x,      my    ],  // 7 L
  ];
}

// Which edges each handle controls: [left, top, right, bottom] bool
const HANDLE_EDGES = [
  [1,1,0,0], // TL
  [0,1,0,0], // T
  [0,1,1,0], // TR
  [0,0,1,0], // R
  [0,0,1,1], // BR
  [0,0,0,1], // B
  [1,0,0,1], // BL
  [1,0,0,0], // L
];

const HANDLE_CURSORS = [
  'nw-resize','n-resize','ne-resize','e-resize',
  'se-resize','s-resize','sw-resize','w-resize',
];

let drag = null; // { type: 'handle'|'move'|'draw', handleIdx?, startRect, startX, startY }

function hitHandle(mx, my) {
  const { x, y, w, h } = toCanvas(rect);
  const hs = handles(x, y, w, h);
  for (let i = 0; i < hs.length; i++) {
    const [hx, hy] = hs[i];
    if (Math.abs(mx - hx) <= HANDLE_SIZE && Math.abs(my - hy) <= HANDLE_SIZE) return i;
  }
  return -1;
}

function insideRect(mx, my) {
  const { x, y, w, h } = toCanvas(rect);
  return mx >= x && mx <= x + w && my >= y && my <= y + h;
}

canvas.addEventListener('mousedown', e => {
  const { ox, oy } = offset(e);
  const hi = hitHandle(ox, oy);
  if (hi >= 0) {
    drag = { type: 'handle', handleIdx: hi, startRect: { ...rect }, startX: ox, startY: oy };
  } else if (insideRect(ox, oy)) {
    drag = { type: 'move', startRect: { ...rect }, startX: ox, startY: oy };
    canvas.style.cursor = 'grabbing';
  } else {
    // Start drawing new rect
    const { fx, fy } = toFrac(ox, oy);
    drag = { type: 'draw', startFx: fx, startFy: fy };
    rect = { l: fx, t: fy, r: fx, b: fy };
  }
});

window.addEventListener('mousemove', e => {
  if (!drag) {
    // Update cursor
    const { ox, oy } = offset(e);
    const hi = hitHandle(ox, oy);
    if (hi >= 0) canvas.style.cursor = HANDLE_CURSORS[hi];
    else if (insideRect(ox, oy)) canvas.style.cursor = 'grab';
    else canvas.style.cursor = 'crosshair';
    return;
  }

  const { ox, oy } = offset(e);

  if (drag.type === 'handle') {
    const dx = ox - drag.startX, dy = oy - drag.startY;
    const [el, et, er, eb] = HANDLE_EDGES[drag.handleIdx];
    const s = drag.startRect;
    let nl = s.l, nt = s.t, nr = s.r, nb = s.b;
    if (el) nl = clamp(s.l + dx / canvasW, 0, nr - 0.01);
    if (et) nt = clamp(s.t + dy / canvasH, 0, nb - 0.01);
    if (er) nr = clamp(s.r + dx / canvasW, nl + 0.01, 1);
    if (eb) nb = clamp(s.b + dy / canvasH, nt + 0.01, 1);
    rect = { l: nl, t: nt, r: nr, b: nb };

  } else if (drag.type === 'move') {
    const dx = (ox - drag.startX) / canvasW;
    const dy = (oy - drag.startY) / canvasH;
    const s = drag.startRect;
    const w = s.r - s.l, h = s.b - s.t;
    const nl = clamp(s.l + dx, 0, 1 - w);
    const nt = clamp(s.t + dy, 0, 1 - h);
    rect = { l: nl, t: nt, r: nl + w, b: nt + h };

  } else if (drag.type === 'draw') {
    const { fx, fy } = toFrac(ox, oy);
    rect = {
      l: clamp(Math.min(drag.startFx, fx), 0, 1),
      t: clamp(Math.min(drag.startFy, fy), 0, 1),
      r: clamp(Math.max(drag.startFx, fx), 0, 1),
      b: clamp(Math.max(drag.startFy, fy), 0, 1),
    };
  }

  draw();
});

window.addEventListener('mouseup', () => {
  drag = null;
  canvas.style.cursor = 'crosshair';
});

function offset(e) {
  const r = canvas.getBoundingClientRect();
  return { ox: e.clientX - r.left, oy: e.clientY - r.top };
}

function fmt(v) { return v.toFixed(3); }

function cropStr() {
  return `(${fmt(rect.l)}, ${fmt(rect.t)}, ${fmt(rect.r)}, ${fmt(rect.b)})`;
}

function updateOutput() {
  document.getElementById('crop-value').textContent = `DISPLAY_CROP = ${cropStr()}`;
  const { x, y, w, h } = toCanvas(rect);
  document.getElementById('coords-detail').textContent =
    `canvas px: x=${Math.round(x)} y=${Math.round(y)} w=${Math.round(w)} h=${Math.round(h)}  |  img px: x=${Math.round(x/scale)} y=${Math.round(y/scale)} w=${Math.round(w/scale)} h=${Math.round(h/scale)}`;
}

function copyValue() {
  const txt = cropStr();
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}
</script>
</body>
</html>
