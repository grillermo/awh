<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #111; color: #eee; font-family: monospace; display: flex; flex-direction: column; }
    #status { display: none; }
    main { flex: 1; display: flex; gap: 0; min-height: 0; overflow: hidden; }
    #frame-pane {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-right: 1px solid #222;
    }
    #frame-img {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
    #topbar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0%;
      background: #f00;
      box-shadow: 0 0 8px #f00;
      transition: width 0.2s ease, opacity 0.3s ease;
      z-index: 9999;
      opacity: 1;
      pointer-events: none;
    }
    #topbar.hidden { opacity: 0; }
    #frame-pane { flex: 1; min-width: 0; }
    #ocr-pane {
      flex: 1;
      min-width: 0;
      padding: 24px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      overflow: hidden;
    }
    #ocr-label { font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    #ocr-text {
      font-size: clamp(64px, 15vw, 200px);
      font-weight: bold;
      color: #fff;
      word-break: break-all;
      line-height: 1.1;
      text-align: center;
    }
    #ocr-text.is-error { color: #f66; }
    #reset-history {
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
      width: 100%;
      max-height: 120px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .reset-marker {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }
    .reset-marker::before {
      content: '';
      display: block;
      height: 2px;
      flex: 1;
      background: #c44;
    }
    .reset-marker-time {
      font-size: 11px;
      color: #c44;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    #error-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 5px;
      background: #1a1a1a;
      z-index: 9999;
      pointer-events: none;
    }
    #error-fill {
      height: 100%;
      width: 0%;
      background: #c44;
      box-shadow: 0 0 6px #c44;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <main>
    <div id="frame-pane">
      <img id="frame-img" alt="corrected frame" />
    </div>
    <div id="ocr-pane">
      <div id="ocr-label">OCR Text</div>
      <div id="ocr-text">—</div>
      <div id="reset-history"></div>
    </div>
  </main>
  <div id="error-bar"><div id="error-fill"></div></div>
  <script>
    const img = document.getElementById('frame-img');
    const topbar = document.getElementById('topbar');
    const ocrEl = document.getElementById('ocr-text');
    const errorFill = document.getElementById('error-fill');
    const resetHistory = document.getElementById('reset-history');
    let lastTs = null;
    let barTimer = null;

    let chainCount = 0;
    let chainTimer = null;
    let resetInProgress = false;

    function updateErrorBar() {
      errorFill.style.width = (chainCount / 4 * 100) + '%';
    }

    function addResetMarker() {
      const now = new Date();
      const hhmm = now.toTimeString().slice(0, 5);
      const marker = document.createElement('div');
      marker.className = 'reset-marker';
      const label = document.createElement('span');
      label.className = 'reset-marker-time';
      label.textContent = hhmm;
      marker.appendChild(label);
      resetHistory.prepend(marker);
    }

    function recordChainError() {
      clearTimeout(chainTimer);
      chainCount++;
      updateErrorBar();

      if (chainCount >= 4) {
        chainCount = 0;
        updateErrorBar();
        triggerReset();
        return;
      }

      chainTimer = setTimeout(() => {
        chainCount = 0;
        updateErrorBar();
      }, 2000);
    }

    async function triggerReset() {
      resetInProgress = true;
      addResetMarker();
      try {
        await fetch('/reset', { method: 'POST' });
      } catch (e) {
        console.error('[reset] fetch failed', e);
      }
      await new Promise(r => setTimeout(r, 15000));
      resetInProgress = false;
    }

    function barStart() {
      clearTimeout(barTimer);
      topbar.style.transition = 'width 0.2s ease, opacity 0.3s ease';
      topbar.classList.remove('hidden');
      topbar.style.width = '0%';
      requestAnimationFrame(() => {
        topbar.style.transition = 'width 8s cubic-bezier(0.1,0.05,0,1), opacity 0.3s ease';
        topbar.style.width = '85%';
      });
    }

    function barDone() {
      topbar.style.transition = 'width 0.15s ease, opacity 0.4s ease 0.15s';
      topbar.style.width = '100%';
      barTimer = setTimeout(() => topbar.classList.add('hidden'), 550);
    }

    function barError() {
      topbar.style.width = '100%';
      topbar.style.background = '#c44';
      topbar.style.boxShadow = '0 0 8px #c44';
      barTimer = setTimeout(() => {
        topbar.classList.add('hidden');
        topbar.style.background = '#f00';
        topbar.style.boxShadow = '0 0 8px #f00';
      }, 600);
    }

    function renderFrame(data) {
      return new Promise(resolve => {
        img.onload = () => { barDone(); resolve(); };
        img.onerror = () => { barDone(); resolve(); };
        img.src = 'data:image/jpeg;base64,' + data.frame_b64;
      });
    }

    async function loop() {
      while (true) {
        try {
          barStart();
          const res = await fetch('/last_frame');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || 'no frame');

          await renderFrame(data);
          ocrEl.textContent = data.ocr_text || '—';
          const isErr = data.ocr_text && !/^\d/.test(data.ocr_text);
          ocrEl.classList.toggle('is-error', isErr);
          lastTs = Date.now();

          if (!resetInProgress && isErr) {
            recordChainError();
          }
        } catch (e) {
          barError();
          await new Promise(r => setTimeout(r, 500));
        }
      }
    }

    loop();

    function isLandscape() {
      return window.innerWidth > window.innerHeight;
    }

    function tryFullscreen() {
      if (!document.fullscreenElement && isLandscape()) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.fullscreenElement && !isLandscape()) {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('orientationchange', () => setTimeout(tryFullscreen, 100));
    window.addEventListener('resize', tryFullscreen);
    document.body.addEventListener('click', tryFullscreen);
    tryFullscreen();
  </script>
</body>
</html>
