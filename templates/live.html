<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #111; color: #eee; font-family: monospace; display: flex; flex-direction: column; }
    #status { display: none; }
    main { flex: 1; display: flex; gap: 0; min-height: 0; overflow: hidden; }
    #frame-pane {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-right: 1px solid #222;
    }
    #frame-img {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
    #topbar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0%;
      background: #f00;
      box-shadow: 0 0 8px #f00;
      transition: width 0.2s ease, opacity 0.3s ease;
      z-index: 9999;
      opacity: 1;
      pointer-events: none;
    }
    #topbar.hidden { opacity: 0; }
    #frame-pane { flex: 1; min-width: 0; }
    #ocr-pane {
      flex: 1;
      min-width: 0;
      padding: 24px 20px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      overflow: hidden;
    }
    #ocr-label { font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    #reset-btn {
      background: rgba(180,60,60,0.2);
      color: #c44;
      border: 1px solid #c44;
      border-radius: 4px;
      padding: 8px 24px;
      font-family: monospace;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
      touch-action: manipulation;
    }
    #reset-btn:active { background: rgba(180,60,60,0.5); }
    #auto-reset-toggle {
      background: rgba(60,60,60,0.2);
      color: #888;
      border: 1px solid #888;
      border-radius: 4px;
      padding: 14px 28px;
      font-family: monospace;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 1px;
      touch-action: manipulation;
      min-width: 260px;
    }
    #auto-reset-toggle.is-on {
      background: rgba(200,80,80,0.25);
      color: #f88;
      border-color: #c44;
    }
    #auto-reset-toggle:active { opacity: 0.7; }
    #ocr-text {
      font-size: clamp(64px, 15vw, 200px);
      font-weight: bold;
      color: #fff;
      word-break: break-all;
      line-height: 1.1;
      text-align: center;
    }
    #ocr-text.is-error { color: #f66; }
    #reset-count {
      width: 100%;
      text-align: center;
      font-size: 64px;
      font-weight: bold;
      line-height: 1;
      color: #c44;
    }
    #reset-count-label {
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      color: #c44;
      opacity: 0.7;
    }
    #error-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 5px;
      background: #1a1a1a;
      z-index: 9999;
      pointer-events: none;
    }
    #error-fill {
      height: 100%;
      width: 0%;
      background: #c44;
      box-shadow: 0 0 6px #c44;
      transition: width 0.2s ease;
    }
    #crop-controls {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .edge-ctrl {
      position: absolute;
      display: flex;
      gap: 6px;
      pointer-events: all;
    }
    .left-ctrl  { left: 8px;   top: 50%; transform: translateY(-50%); flex-direction: column; }
    .right-ctrl { right: 8px;  top: 50%; transform: translateY(-50%); flex-direction: column; }
    .top-ctrl   { top: 8px;    left: 50%; transform: translateX(-50%); flex-direction: row; }
    .bottom-ctrl{ bottom: 12px; left: 50%; transform: translateX(-50%); flex-direction: row; }
    .arrow-btn {
      background: rgba(0,0,0,0.65);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 4px;
      width: 38px;
      height: 38px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      user-select: none;
    }
    .arrow-btn:active { background: rgba(255,255,255,0.2); }
    .crop-flash {
      position: absolute;
      top: 4px; right: 8px;
      font-size: 11px;
      color: #8f8;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .crop-flash.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <main>
    <div id="frame-pane">
      <img id="frame-img" alt="corrected frame" />
      <div id="crop-controls">
        <div class="edge-ctrl left-ctrl">
          <button class="arrow-btn" data-edge="left" data-dir="-1">←</button>
          <button class="arrow-btn" data-edge="left" data-dir="1">→</button>
        </div>
        <div class="edge-ctrl right-ctrl">
          <button class="arrow-btn" data-edge="right" data-dir="-1">←</button>
          <button class="arrow-btn" data-edge="right" data-dir="1">→</button>
        </div>
        <div class="edge-ctrl top-ctrl">
          <button class="arrow-btn" data-edge="top" data-dir="-1">↑</button>
          <button class="arrow-btn" data-edge="top" data-dir="1">↓</button>
        </div>
        <div class="edge-ctrl bottom-ctrl">
          <button class="arrow-btn" data-edge="bottom" data-dir="-1">↑</button>
          <button class="arrow-btn" data-edge="bottom" data-dir="1">↓</button>
        </div>
        <div class="crop-flash" id="crop-flash"></div>
      </div>
    </div>
    <div id="ocr-pane">
      <div id="ocr-label">OCR Text</div>
      <div id="ocr-text">—</div>
      <button id="reset-btn">RESET</button>
      <button id="auto-reset-toggle">DISABLE AUTO-RESET</button>
      <div id="reset-count">0</div>
      <div id="reset-count-label">RESETS</div>
    </div>
  </main>
  <div id="error-bar"><div id="error-fill"></div></div>
  <script>
    (() => {
      const reportError = payload => {
        const body = JSON.stringify({
          ...payload,
          href: window.location.href,
          userAgent: navigator.userAgent,
          reportedAt: new Date().toISOString(),
        });

        try {
          if (navigator.sendBeacon) {
            const blob = new Blob([body], { type: 'application/json' });
            navigator.sendBeacon('/report-error', blob);
            return;
          }
        } catch (_) {}

        try {
          fetch('/report-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body,
            keepalive: true,
          }).catch(() => {});
        } catch (_) {}
      };

      window.addEventListener('error', event => {
        reportError({
          type: 'error',
          message: event.message,
          source: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: event.error && event.error.stack ? event.error.stack : null,
        });
      });

      window.addEventListener('unhandledrejection', event => {
        const reason = event.reason;
        reportError({
          type: 'unhandledrejection',
          message: reason && reason.message ? reason.message : String(reason),
          stack: reason && reason.stack ? reason.stack : null,
          reason,
        });
      });

      try {
        const img = document.getElementById('frame-img');
        const topbar = document.getElementById('topbar');
        const ocrEl = document.getElementById('ocr-text');
        const errorFill = document.getElementById('error-fill');
        const resetCountEl = document.getElementById('reset-count');
        let resetCount = 0;
        let lastTs = null;
        let barTimer = null;

        let chainCount = 0;
        let chainTimer = null;
        let resetInProgress = false;
        let consecutiveResets = 0;
        let autoResetDisabled = false;

        function updateErrorBar() {
          errorFill.style.width = (chainCount / 4 * 100) + '%';
        }

        function addResetMarker() {
          resetCount++;
          resetCountEl.textContent = resetCount;
        }

        function recordChainError() {
          clearTimeout(chainTimer);
          chainCount++;
          updateErrorBar();

          if (chainCount >= 4) {
            chainCount = 0;
            updateErrorBar();
            if (!autoResetDisabled) triggerReset();
            return;
          }

          chainTimer = setTimeout(() => {
            chainCount = 0;
            updateErrorBar();
          }, 3000);
        }

        function makeSound() {
              window.webkit.messageHandlers.soundBridge.postMessage("playSound");
        }

        function triggerReset() {
          if (consecutiveResets >= 3) return;
          consecutiveResets++;
          resetInProgress = true;
          addResetMarker();
          fetch('/reset', { method: 'POST' }).catch(e => console.error('[reset] fetch failed', e));
          makeSound();
          setTimeout(() => { 
              resetInProgress = false;
              makeSound();
          }, 15000);
        }

        function barStart() {
          clearTimeout(barTimer);
          topbar.style.transition = 'width 0.2s ease, opacity 0.3s ease';
          topbar.classList.remove('hidden');
          topbar.style.width = '0%';
          requestAnimationFrame(() => {
            topbar.style.transition = 'width 8s cubic-bezier(0.1,0.05,0,1), opacity 0.3s ease';
            topbar.style.width = '85%';
          });
        }

        function barDone() {
          topbar.style.transition = 'width 0.15s ease, opacity 0.4s ease 0.15s';
          topbar.style.width = '100%';
          barTimer = setTimeout(() => topbar.classList.add('hidden'), 550);
        }

        function barError() {
          topbar.style.width = '100%';
          topbar.style.background = '#c44';
          topbar.style.boxShadow = '0 0 8px #c44';
          barTimer = setTimeout(() => {
            topbar.classList.add('hidden');
            topbar.style.background = '#f00';
            topbar.style.boxShadow = '0 0 8px #f00';
          }, 600);
        }

        function renderFrame(data) {
          return new Promise(resolve => {
            img.onload = () => { barDone(); resolve(); };
            img.onerror = () => { barDone(); resolve(); };
            img.src = 'data:image/jpeg;base64,' + data.frame_b64;
          });
        }

        async function loop() {
          while (true) {
            try {
              barStart();
              const res = await fetch('/last_frame');
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();
              if (!data.ok) throw new Error(data.error || 'no frame');

              await renderFrame(data);
              ocrEl.textContent = data.ocr_text || '—';
              const isErr = data.ocr_text && !/^\d/.test(data.ocr_text);
              ocrEl.classList.toggle('is-error', isErr);
              lastTs = Date.now();

              if (!isErr) consecutiveResets = 0;

              if (!resetInProgress && isErr) {
                recordChainError();
              }
              await new Promise(r => setTimeout(r, 1000));
            } catch (e) {
              barError();
              await new Promise(r => setTimeout(r, 500));
            }
          }
        }

        loop();

        document.getElementById('reset-btn').addEventListener('click', triggerReset);

        const autoResetToggle = document.getElementById('auto-reset-toggle');
        autoResetToggle.addEventListener('click', () => {
          autoResetDisabled = !autoResetDisabled;
          autoResetToggle.classList.toggle('is-on', autoResetDisabled);
          autoResetToggle.textContent = autoResetDisabled ? 'AUTO-RESET DISABLED' : 'DISABLE AUTO-RESET';
        });

        const cropFlash = document.getElementById('crop-flash');
        let flashTimer = null;

        function showCropFlash(crop) {
          cropFlash.textContent = crop.map(v => v.toFixed(3)).join(', ');
          cropFlash.classList.add('show');
          clearTimeout(flashTimer);
          flashTimer = setTimeout(() => cropFlash.classList.remove('show'), 1500);
        }

        document.querySelectorAll('.arrow-btn').forEach(btn => {
          btn.addEventListener('click', async e => {
            e.stopPropagation();
            const edge = btn.dataset.edge;
            const dir = parseInt(btn.dataset.dir, 10);
            try {
              const res = await fetch('/api/update-crop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ edge, dir }),
              });
              const data = await res.json();
              if (data.ok) showCropFlash(data.crop);
            } catch (err) {
              console.error('[crop] update failed', err);
            }
          });
        });
      } catch (error) {
        reportError({
          type: 'top-level-catch',
          message: error && error.message ? error.message : String(error),
          stack: error && error.stack ? error.stack : null,
        });
        throw error;
      }
    })();
  </script>
</body>
</html>
